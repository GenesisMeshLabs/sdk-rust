name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Rust ${{ matrix.rust }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]
        include:
          - os: ubuntu-latest
            rust: "1.85.0"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ matrix.rust }}
      # The SDK, genesis-mesh-verify (verifier/) and genesis-mesh-edge (edge/,
      # 1.7.0: Unix only; its live scenarios run in edge.yml).
      - run: cargo test --locked --workspace --all-targets ${{ runner.os == 'Windows' && '--exclude genesis-mesh-edge' || '' }}
      - run: cargo test --locked --doc

  # 1.7.0: the SDK without its default `client` feature is the offline
  # modules only, and genesis-mesh-verify depends on it so: neither may
  # depend on an HTTP, async, TLS or database crate.
  features:
    name: Without the client feature
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # stable
        with:
          toolchain: stable
      - run: cargo check --locked -p genesis-mesh-sdk --no-default-features --all-targets
      - run: cargo test --locked -p genesis-mesh-sdk --no-default-features
      - name: No HTTP, async, TLS or database crate without the client feature
        run: |
          set -eu
          for package in "genesis-mesh-sdk --no-default-features" "genesis-mesh-verify"; do
            # shellcheck disable=SC2086
            tree="$(cargo tree --locked -p $package -e normal --prefix none -f '{p}' --target x86_64-unknown-linux-musl)"
            if echo "$tree" | grep -E '^(reqwest|hyper|hyper-util|h2|tokio|mio|socket2|rustls|ring|webpki|rusqlite|libsqlite3-sys|futures)'; then
              echo "::error::$package depends on the crates listed above"; exit 1
            fi
            echo "$package: $(echo "$tree" | sort -u | wc -l) crates, none of them HTTP, async, TLS or database"
          done

  sdk-e2e:
    name: SDK against core main
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # name when it exists, and against main otherwise.
      - name: Choose the core revision
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        # A release tag is tested against the core release of the same version
        # (the core leads the train), never core main, which may already be ahead.
        run: |
          ref=main
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            ref="$GITHUB_REF_NAME"
          elif git ls-remote --exit-code --heads https://github.com/GenesisMeshLabs/genesismesh.git "refs/heads/$BRANCH" > /dev/null; then
            ref="$BRANCH"
          fi
          echo "Testing with core revision: $ref"
          echo "CORE_REF=$ref" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: GenesisMeshLabs/genesismesh
          ref: ${{ env.CORE_REF }}
          path: core
      - name: The signing vectors are the core's
        run: |
          for suite in admin_auth field_registry canonical out_of_band remediation audit grants node; do
            if [ -f "core/conformance/vectors/$suite.json" ]; then
              cmp "core/conformance/vectors/$suite.json" "tests/fixtures/$suite.json"
            else
              echo "::notice::The core revision has no $suite vectors yet; skipped."
            fi
          done
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # stable
        with:
          toolchain: stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ./core
      # 1.5.0: the frozen audit pack is the core's, byte for byte.
      - name: The frozen audit pack is the core's
        run: |
          if [ -d core/conformance/fixtures/audit-pack-1.5.0 ]; then
            diff -r core/conformance/fixtures/audit-pack-1.5.0 tests/fixtures/audit-pack-1.5.0
          else
            echo "::notice::The core revision has no frozen 1.5.0 pack yet; skipped."
          fi
      # genesis-mesh-verify against the core's verification corpus, generated
      # from the same core revision; every case must have an adapter.
      - name: genesis-mesh-verify against the reference corpus
        run: |
          if [ -f core/scripts/export_reference_corpus.py ]; then
            python core/scripts/export_reference_corpus.py --suite verification --out "$RUNNER_TEMP/corpus"
            export GM_VERIFY_CORPUS="$RUNNER_TEMP/corpus/verification" GM_VERIFY_CORPUS_STRICT=1
            cargo test --locked -p genesis-mesh-verify --test differential -- --nocapture
          else
            echo "::notice::The core revision has no verification corpus yet; skipped."
          fi
      - name: Governed-action lifecycle against a live NA
        run: cargo test --locked --test live_na -- --nocapture
        env:
          GM_E2E_PYTHON: python

  release-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python scripts/check_release.py
      - run: cargo fmt --all -- --check
      # verifier/clippy.toml refuses network and signing code in genesis-mesh-verify.
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo package --locked
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  release-train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify release train (Genesis Mesh core leads every version)
        shell: bash
        run: |
            set -euo pipefail
            if [ -f VERSION ]; then
              version="$(tr -d '[:space:]' < VERSION)"
            else
              version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
            fi
            # The contents API is read fresh; raw.githubusercontent.com caches VERSION for minutes after a core merge.
            # A pull request is checked against the core branch of the same name when it
            # exists: the core's release/X.Y.Z while the train's release PRs are open, so
            # they pass together. The core still merges first: a push to main or a tag
            # build reads the core's main, and a tag must also match a core tag.
            core_ref=main
            if [ -n "${GITHUB_HEAD_REF:-}" ] && git ls-remote --exit-code --heads https://github.com/GenesisMeshLabs/genesismesh.git "refs/heads/$GITHUB_HEAD_REF" > /dev/null; then
              core_ref="$GITHUB_HEAD_REF"
            fi
            # A branch name is a query value: encoded, so '#', '&' or '+' in it cannot change the request.
            ref_query="$(jq -rn --arg ref "$core_ref" '$ref | @uri')"
            core="$(curl -fsSL --retry 3 -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github.raw" "https://api.github.com/repos/GenesisMeshLabs/genesismesh/contents/VERSION?ref=$ref_query" | tr -d '[:space:]')"
            if [ "$(printf '%s\n%s\n' "$version" "$core" | sort -V | tail -n 1)" != "$core" ]; then
              echo "::error::Version $version is ahead of the Genesis Mesh core ($core). The core leads every coordinated version; see genesismesh docs/development/versioning.md."
              exit 1
            fi
            if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
              if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
                echo "::error::Tag $GITHUB_REF_NAME does not match version $version."
                exit 1
              fi
              # The core release is tagged first, even when the core's main already names the version.
              if ! git ls-remote --exit-code --tags https://github.com/GenesisMeshLabs/genesismesh.git "refs/tags/v$version" > /dev/null; then
                echo "::error::The Genesis Mesh core has no tag v$version (core main is $core). Release the core first."
                exit 1
              fi
            fi
            echo "Release train verified: $version (core $core)"

  github-release:
    if: github.ref_type == 'tag'
    # sdk-e2e runs the crate against the core release of the same tag.
    needs: [test, sdk-e2e, release-checks, release-train]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists"
            exit 0
          fi
          awk -v v="$version" '/^## /{ if (p) exit; if (index($0, "[" v "]") || index($0, "## " v " ")) p = 1; next } p' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || echo "Coordinated Genesis Mesh $tag release." > release-notes.md
          # The Verifier workflow may create it meanwhile, to attach its binaries.
          gh release create "$tag" --title "$tag" --notes-file release-notes.md --verify-tag \n            || gh release view "$tag" > /dev/null

  changelog:
    name: Changelog fragments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Pull requests add changelog.d/<version>/<name>.md; only a release PR
      # (branch release/...) folds them into CHANGELOG.md, so a feature PR for
      # the next version never conflicts with the release of this one.
      - name: Pull requests add fragments; only a release edits CHANGELOG.md
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: python3 scripts/changelog.py check ${BASE_REF:+--base origin/$BASE_REF} --branch "$HEAD_REF"
