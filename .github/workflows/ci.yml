name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Rust ${{ matrix.rust }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]
        include:
          - os: ubuntu-latest
            rust: "1.85.0"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: ${{ matrix.rust }}
      - run: cargo test --locked --all-targets
      - run: cargo test --locked --doc

  sdk-e2e:
    name: SDK against core main
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # name when it exists, and against main otherwise.
      - name: Choose the core revision
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          ref=main
          if git ls-remote --exit-code --heads https://github.com/GenesisMeshLabs/genesismesh.git "refs/heads/$BRANCH" > /dev/null; then ref="$BRANCH"; fi
          echo "Testing with core revision: $ref"
          echo "CORE_REF=$ref" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: GenesisMeshLabs/genesismesh
          ref: ${{ env.CORE_REF }}
          path: core
      - name: The signing vectors are the core's
        run: |
          for suite in admin_auth field_registry canonical; do
            if [ -f "core/conformance/vectors/$suite.json" ]; then
              cmp "core/conformance/vectors/$suite.json" "tests/fixtures/$suite.json"
            else
              echo "::notice::The core revision has no $suite vectors yet; skipped."
            fi
          done
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        with:
          toolchain: stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ./core
      - name: Governed-action lifecycle against a live NA
        run: cargo test --locked --test live_na -- --nocapture
        env:
          GM_E2E_PYTHON: python

  release-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python scripts/check_release.py
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo package --locked
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  release-train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify release train (Genesis Mesh core leads every version)
        shell: bash
        run: |
            set -euo pipefail
            if [ -f VERSION ]; then
              version="$(tr -d '[:space:]' < VERSION)"
            else
              version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
            fi
            # The contents API is read fresh; raw.githubusercontent.com caches VERSION for minutes after a core merge.
            core="$(curl -fsSL --retry 3 -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github.raw" "https://api.github.com/repos/GenesisMeshLabs/genesismesh/contents/VERSION?ref=main" | tr -d '[:space:]')"
            if [ "$(printf '%s\n%s\n' "$version" "$core" | sort -V | tail -n 1)" != "$core" ]; then
              echo "::error::Version $version is ahead of the Genesis Mesh core ($core). The core leads every coordinated version; see genesismesh docs/development/versioning.md."
              exit 1
            fi
            if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
              if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
                echo "::error::Tag $GITHUB_REF_NAME does not match version $version."
                exit 1
              fi
              if [ "$version" != "$core" ] && ! git ls-remote --exit-code --tags https://github.com/GenesisMeshLabs/genesismesh.git "refs/tags/v$version" > /dev/null; then
                echo "::error::Release $version is not a Genesis Mesh core version (core is $core). Release the core first."
                exit 1
              fi
            fi
            echo "Release train verified: $version (core $core)"

  github-release:
    if: github.ref_type == 'tag'
    needs: [test, release-checks, release-train]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists"
            exit 0
          fi
          awk -v v="$version" '/^## /{ if (p) exit; if (index($0, "[" v "]") || index($0, "## " v " ")) p = 1; next } p' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || echo "Coordinated Genesis Mesh $tag release." > release-notes.md
          gh release create "$tag" --title "$tag" --notes-file release-notes.md --verify-tag
