name: Edge agent soak

# The edge agent's two-hour scenario (docs/edge.md): the static binary, with
# the NA stopped for 7200 s of real time, then every record uploaded in order
# within 120 s, measured with /usr/bin/time -v. Weekly on x86-64, and on
# release pull requests on both architectures. Pull requests run the same
# scenario for 120 s (edge.yml).

on:
  schedule:
    - cron: "17 3 * * 1"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: edge-soak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  soak:
    name: Soak ${{ matrix.target }}
    if: github.event_name == 'schedule' || startsWith(github.head_ref, 'release/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: x86_64-unknown-linux-musl, release_only: false}
          - {os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, release_only: true}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      TARGET: ${{ matrix.target }}
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
      RUN: ${{ !matrix.release_only || github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN == 'true'
      - name: The toolchain the build script pins
        if: env.RUN == 'true'
        id: pin
        run: echo "toolchain=$(sed -n 's/^RUST_TOOLCHAIN=//p' scripts/build_verifier.sh)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        if: env.RUN == 'true'
        with:
          toolchain: ${{ steps.pin.outputs.toolchain }}
          targets: ${{ matrix.target }}
      - if: env.RUN == 'true'
        run: sudo apt-get update && sudo apt-get install -y musl-tools time
      - name: Build
        if: env.RUN == 'true'
        run: |
          set -eu
          sh scripts/build_edge.sh "$TARGET" dist
          name="$(cd dist && ls genesis-mesh-edge-* | grep -Ev '\.(sha256|buildinfo)$')"
          echo "BINARY=$GITHUB_WORKSPACE/dist/$name" >> "$GITHUB_ENV"
      - name: Choose the core revision
        if: env.RUN == 'true'
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          ref=main
          if git ls-remote --exit-code --heads https://github.com/GenesisMeshLabs/genesismesh.git "refs/heads/$BRANCH" > /dev/null; then
            ref="$BRANCH"
          fi
          echo "Testing with core revision: $ref"
          echo "CORE_REF=$ref" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN == 'true'
        with:
          repository: GenesisMeshLabs/genesismesh
          ref: ${{ env.CORE_REF }}
          path: core
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: env.RUN == 'true'
        with:
          python-version: "3.12"
      - if: env.RUN == 'true'
        run: python -m pip install -e ./core
      - name: Two hours with the NA stopped
        if: env.RUN == 'true'
        env:
          GM_E2E_PYTHON: python
          GM_EDGE_OFFLINE_SECONDS: "7200"
        run: |
          set -eu
          export GM_EDGE_BINARY="$BINARY"
          export GM_EDGE_WRAP="/usr/bin/time -v -o $RUNNER_TEMP/time.txt"
          cargo test --locked -p genesis-mesh-edge --test scenario -- --nocapture --exact offline
          cat "$RUNNER_TEMP/time.txt"
          rss="$(sed -n 's/^[[:space:]]*Maximum resident set size (kbytes): //p' "$RUNNER_TEMP/time.txt")"
          jq -n --arg target "$TARGET" --argjson binary_bytes "$(stat -c %s "$BINARY")" \
            --argjson max_rss_kib "$rss" --argjson offline_seconds "$GM_EDGE_OFFLINE_SECONDS" \
            --argjson budget "$(jq --arg t "$TARGET" '.[$t]' edge/footprint-budgets.json)" \
            '{target: $target, binary_bytes: $binary_bytes, max_rss_kib: $max_rss_kib,
              offline_seconds: $offline_seconds, budget: $budget}' > "soak-$TARGET.json"
          cat "soak-$TARGET.json"
          budget="$(jq -r --arg t "$TARGET" '.[$t].max_rss_kib' edge/footprint-budgets.json)"
          if [ "$rss" -gt "$budget" ]; then
            echo "::error::the agent's maximum RSS was $rss KiB, over its budget of $budget"; exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: env.RUN == 'true'
        with:
          name: soak-${{ matrix.target }}
          path: soak-${{ matrix.target }}.json
          if-no-files-found: error
