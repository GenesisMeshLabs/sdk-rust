name: Edge agent soak

# Weekly: the two-hour scenario against core main (edge-soak-run.yml). A fixed
# revision only: a scheduled run never checks out a ref derived from the run.

on:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  soak:
    uses: ./.github/workflows/edge-soak-run.yml
    with:
      core_ref: main
