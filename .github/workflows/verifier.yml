name: Verifier

# genesis-mesh-verify (docs/verifier.md): static Linux binaries (musl, x86-64
# and arm64), built twice in two directories and compared byte for byte, with
# no dynamic dependency and no HTTP stack linked, and tested without a
# network. A v* tag also signs them (Sigstore) and attaches them, with their
# checksums, to the release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  # The merge queue runs the required checks on the PR on top of main.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verifier-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: x86_64-unknown-linux-musl}
          - {os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      TARGET: ${{ matrix.target }}
      # ring (a dependency of the SDK's HTTP client, not linked into the
      # binary) still compiles its C code for the target.
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: first
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: elsewhere/second
      - name: The toolchain the build script pins
        id: pin
        run: echo "toolchain=$(sed -n 's/^RUST_TOOLCHAIN=//p' first/scripts/build_verifier.sh)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.pin.outputs.toolchain }}
          targets: ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build twice, in two directories
        run: |
          set -eu
          for dir in first elsewhere/second; do
            (cd "$dir" && CARGO_TARGET_DIR="$GITHUB_WORKSPACE/$dir-target" \
              sh scripts/build_verifier.sh "$TARGET" "$GITHUB_WORKSPACE/$dir-dist")
          done
          name="$(cd first-dist && ls genesis-mesh-verify-* | grep -Ev '\.(sha256|buildinfo)$')"
          echo "BINARY=$GITHUB_WORKSPACE/first-dist/$name" >> "$GITHUB_ENV"
          echo "NAME=$name" >> "$GITHUB_ENV"
      - name: Reproducible (the two builds are identical)
        run: |
          cat first-dist/"$NAME".sha256 elsewhere/second-dist/"$NAME".sha256
          cmp first-dist/"$NAME" elsewhere/second-dist/"$NAME"
      - name: Static (no dynamic dependency)
        run: |
          set -eu
          file "$BINARY"
          if readelf -d "$BINARY" | grep -q NEEDED; then
            echo "::error::$NAME needs shared libraries"; exit 1
          fi
          out="$(ldd "$BINARY" 2>&1 || true)"
          echo "$out"
          echo "$out" | grep -Eq 'not a dynamic executable|statically linked'
      - name: No HTTP stack linked
        run: |
          if strings "$BINARY" | grep -E '(reqwest|hyper|hyper-util|h2|rustls|tokio|ring|quinn|webpki|socket2|mio)-[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::an HTTP or network crate is linked into $NAME"; exit 1
          fi
      - name: The tests, against the static binary, without a network
        working-directory: first
        run: |
          set -eu
          exes="$(cargo test --locked -p genesis-mesh-verify --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and .executable != null) | .executable')"
          # The tests run in a network namespace with no interface but a down
          # loopback: nothing can be reached.
          offline() {
            sudo unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups -- \
              env HOME="$HOME" PATH="$PATH" GM_VERIFY_BINARY="$BINARY" "$@"
          }
          if offline curl -sS --max-time 5 -o /dev/null https://github.com; then
            echo "::error::the network namespace reaches the network"; exit 1
          fi
          for exe in $exes; do offline "$exe"; done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verifier-${{ matrix.target }}
          path: first-dist/*
          if-no-files-found: error

  # The required check for the matrix above: one stable name, whatever the
  # targets. It fails when any member failed, was cancelled or was skipped.
  verifier:
    name: Verifier
    if: always()
    needs: [static]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every verifier target passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"(failure|cancelled|skipped)"'; then
            echo "::error::a verifier build or its tests did not pass"; exit 1
          fi

  release:
    if: github.ref_type == 'tag'
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write   # the Sigstore bundles
    env:
      IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/verifier.yml@${{ github.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The tag is this crate's version, and the core release is tagged first.
      - run: python3 scripts/check_release.py
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: verifier-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum --check ./*.sha256
          cat ./*.buildinfo
          sha256sum $(ls genesis-mesh-verify-* | grep -Ev '\.(sha256|buildinfo)$') > SHA256SUMS
          cat SHA256SUMS
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign and verify
        working-directory: dist
        run: |
          set -eu
          for f in SHA256SUMS $(ls genesis-mesh-verify-* | grep -Ev '\.(sha256|buildinfo)$'); do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
            cosign verify-blob --bundle "$f.sigstore.json" --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$f"
          done
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          if ! gh release view "$tag" > /dev/null 2>&1; then
            awk -v v="$version" '/^## /{ if (p) exit; if (index($0, "[" v "]") || index($0, "## " v " ")) p = 1; next } p' CHANGELOG.md > release-notes.md
            [ -s release-notes.md ] || echo "Coordinated Genesis Mesh $tag release." > release-notes.md
            # CI's github-release job may create it meanwhile.
            gh release create "$tag" --title "$tag" --notes-file release-notes.md --verify-tag \
              || gh release view "$tag" > /dev/null
          fi
          gh release upload "$tag" dist/* --clobber
