name: Edge agent

# genesis-mesh-edge (docs/edge.md, beta): static Linux binaries (musl, x86-64
# and arm64) on native runners, checked for size and for memory over the
# scenario with the NA stopped for 120 s, against the core branch of the same
# name (or main). A v* tag also signs the binaries (Sigstore), attaches them
# with SHA256SUMS-edge, the systemd unit and the example configuration to the
# release, and builds the image from those released binaries: pushed by
# digest, signed, then tagged with the version only (beta).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  # The merge queue runs the required checks on the PR on top of main.
  merge_group:

permissions:
  contents: read

concurrency:
  group: edge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: x86_64-unknown-linux-musl}
          - {os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      TARGET: ${{ matrix.target }}
      # Skipped is not green: every scenario, and every part of one, must run.
      GM_E2E_REQUIRED: "1"
      # SQLite (bundled) and ring are C, compiled for the target.
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The toolchain the build script pins
        id: pin
        run: echo "toolchain=$(sed -n 's/^RUST_TOOLCHAIN=//p' scripts/build_verifier.sh)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ steps.pin.outputs.toolchain }}
          targets: ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y musl-tools time
      - name: Build
        run: |
          set -eu
          sh scripts/build_edge.sh "$TARGET" dist
          name="$(cd dist && ls genesis-mesh-edge-* | grep -Ev '\.(sha256|buildinfo)$')"
          echo "BINARY=$GITHUB_WORKSPACE/dist/$name" >> "$GITHUB_ENV"
          echo "NAME=$name" >> "$GITHUB_ENV"
      - name: Static (no dynamic dependency) and its version
        run: |
          set -eu
          file "$BINARY"
          if readelf -d "$BINARY" | grep -q NEEDED; then
            echo "::error::$NAME needs shared libraries"; exit 1
          fi
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' edge/Cargo.toml | head -n 1)"
          test "$("$BINARY" --version)" = "genesis-mesh-edge $version"
      - name: Size within the budget
        run: |
          set -eu
          size="$(stat -c %s "$BINARY")"
          budget="$(jq -r --arg t "$TARGET" '.[$t].binary_bytes' edge/footprint-budgets.json)"
          echo "binary: $size bytes (budget $budget)"
          echo "BINARY_BYTES=$size" >> "$GITHUB_ENV"
          if [ "$size" -gt "$budget" ]; then
            echo "::error::$NAME is $size bytes, over its budget of $budget"; exit 1
          fi
      # The scenario runs against the core branch of this branch's name when
      # it exists, the core release of a tag's version, and main otherwise.
      - name: Choose the core revision
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          ref=main
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            ref="$GITHUB_REF_NAME"
          elif git ls-remote --exit-code --heads https://github.com/GenesisMeshLabs/genesismesh.git "refs/heads/$BRANCH" > /dev/null; then
            ref="$BRANCH"
          fi
          echo "Testing with core revision: $ref"
          echo "CORE_REF=$ref" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: GenesisMeshLabs/genesismesh
          ref: ${{ env.CORE_REF }}
          path: core
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ./core
      - name: Scenario with the NA stopped for 120 s, measured (C3, C5)
        env:
          GM_E2E_PYTHON: python
          GM_EDGE_OFFLINE_SECONDS: "120"
        run: |
          set -eu
          export GM_EDGE_BINARY="$BINARY"
          export GM_EDGE_WRAP="/usr/bin/time -v -o $RUNNER_TEMP/time.txt"
          bash scripts/require_tests.sh \
            cargo test --locked -p genesis-mesh-edge --test scenario -- --nocapture --include-ignored --exact offline
          cat "$RUNNER_TEMP/time.txt"
          rss="$(sed -n 's/^[[:space:]]*Maximum resident set size (kbytes): //p' "$RUNNER_TEMP/time.txt")"
          budget="$(jq -r --arg t "$TARGET" '.[$t].max_rss_kib' edge/footprint-budgets.json)"
          echo "maximum RSS: $rss KiB (budget $budget)"
          jq -n --arg target "$TARGET" --arg version "$("$BINARY" --version | cut -d ' ' -f 2)" \
            --argjson binary_bytes "$BINARY_BYTES" --argjson max_rss_kib "$rss" \
            --argjson offline_seconds "$GM_EDGE_OFFLINE_SECONDS" \
            --argjson budget "$(jq --arg t "$TARGET" '.[$t]' edge/footprint-budgets.json)" \
            '{target: $target, version: $version, binary_bytes: $binary_bytes, max_rss_kib: $max_rss_kib,
              offline_seconds: $offline_seconds, budget: $budget}' > "footprint-$TARGET.json"
          cat "footprint-$TARGET.json"
          if [ "$rss" -gt "$budget" ]; then
            echo "::error::the agent's maximum RSS was $rss KiB, over its budget of $budget"; exit 1
          fi
      - name: A backlog of 2000 records, measured
        env:
          GM_E2E_PYTHON: python
          GM_EDGE_BACKLOG: "2000"
        run: |
          set -eu
          export GM_EDGE_BINARY="$BINARY"
          export GM_EDGE_WRAP="/usr/bin/time -v -o $RUNNER_TEMP/backlog-time.txt"
          bash scripts/require_tests.sh \
            cargo test --locked -p genesis-mesh-edge --test scenario -- --nocapture --include-ignored --exact backlog
          rss="$(sed -n 's/^[[:space:]]*Maximum resident set size (kbytes): //p' "$RUNNER_TEMP/backlog-time.txt")"
          budget="$(jq -r --arg t "$TARGET" '.[$t].max_rss_kib' edge/footprint-budgets.json)"
          echo "maximum RSS with a backlog of $GM_EDGE_BACKLOG records: $rss KiB (budget $budget)"
          jq --argjson rss "$rss" --argjson records "$GM_EDGE_BACKLOG" \
            '. + {backlog_records: $records, backlog_max_rss_kib: $rss}' "footprint-$TARGET.json" > footprint.tmp
          mv footprint.tmp "footprint-$TARGET.json"
          cat "footprint-$TARGET.json"
          if [ "$rss" -gt "$budget" ]; then
            echo "::error::the agent's maximum RSS with a backlog was $rss KiB, over its budget of $budget"; exit 1
          fi
      - name: The other scenarios, with the static binary (C1, C2, C4; a proxy's 502, a blackholed network, a throttling NA, a stale snapshot, a disconnected client, the local API under load)
        env:
          GM_E2E_PYTHON: python
        # The nine other scenarios (#[ignore]d in plain runs); --skip matches
        # substrings, and a_required skips the harness's own self-test.
        run: |
          export GM_EDGE_BINARY="$BINARY"
          bash scripts/require_tests.sh --min 9 \
            cargo test --locked -p genesis-mesh-edge --test scenario -- --nocapture --include-ignored \
            --skip offline --skip backlog --skip a_required
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: edge-${{ matrix.target }}
          path: |
            dist/*
            footprint-${{ matrix.target }}.json
          if-no-files-found: error

  # The required check for the matrix above: one stable name, whatever the
  # targets. It fails when any member failed, was cancelled or was skipped.
  edge-agent:
    name: Edge agent
    if: always()
    needs: [static]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every edge target passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"(failure|cancelled|skipped)"'; then
            echo "::error::an edge agent build or scenario did not pass"; exit 1
          fi

  release:
    if: github.ref_type == 'tag'
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write   # the Sigstore bundles and the image signature
      packages: write   # the image
    env:
      IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/edge.yml@${{ github.ref }}
      ISSUER: https://token.actions.githubusercontent.com
      IMAGE: ghcr.io/genesismeshlabs/genesis-mesh-edge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The tag is this crate's version, and the core release is tagged first.
      - run: python3 scripts/check_release.py
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: edge-*
          path: built
          merge-multiple: true
      - name: Checksums
        run: |
          set -eu
          mkdir dist
          # Each build uploaded dist/* and its footprint file, so the binaries arrive under
          # built/dist/ and the footprints under built/.
          (cd built/dist && sha256sum --check ./*.sha256 && cat ./*.buildinfo)
          cat built/footprint-*.json
          cp built/dist/genesis-mesh-edge-*-x86_64-unknown-linux-musl built/dist/genesis-mesh-edge-*-aarch64-unknown-linux-musl dist/
          rm -f dist/*.sha256 dist/*.buildinfo
          cp edge/packaging/genesis-mesh-edge.service edge/packaging/edge.toml.example dist/
          (cd dist && sha256sum genesis-mesh-edge-* genesis-mesh-edge.service edge.toml.example > SHA256SUMS-edge && cat SHA256SUMS-edge)
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign and verify the binaries and the checksums
        working-directory: dist
        run: |
          set -eu
          for f in SHA256SUMS-edge $(ls genesis-mesh-edge-* | grep -v '\.sigstore\.json$'); do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
            cosign verify-blob --bundle "$f.sigstore.json" --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer "$ISSUER" "$f"
          done
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          if ! gh release view "$tag" > /dev/null 2>&1; then
            awk -v v="$version" '/^## /{ if (p) exit; if (index($0, "[" v "]") || index($0, "## " v " ")) p = 1; next } p' CHANGELOG.md > release-notes.md
            [ -s release-notes.md ] || echo "Coordinated Genesis Mesh $tag release." > release-notes.md
            # CI's github-release job or the Verifier workflow may create it meanwhile.
            gh release create "$tag" --title "$tag" --notes-file release-notes.md --verify-tag \
              || gh release view "$tag" > /dev/null
          fi
          gh release upload "$tag" dist/* --clobber
      # The image holds the released binaries, byte for byte.
      - name: Build and push the image by digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          mkdir -p image/empty
          cp edge/Dockerfile image/
          cp dist/genesis-mesh-edge-"$version"-x86_64-unknown-linux-musl image/genesis-mesh-edge-amd64
          cp dist/genesis-mesh-edge-"$version"-aarch64-unknown-linux-musl image/genesis-mesh-edge-arm64
          chmod 0755 image/genesis-mesh-edge-*
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # BuildKit pinned by digest: the job holds packages: write and id-token: write.
          docker buildx create --use --name edge \
            --driver-opt image=moby/buildkit:v0.34.0@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c
          docker buildx build image --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="$version" --provenance=false \
            --output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file metadata.json
          digest="$(jq -r '."containerimage.digest"' metadata.json)"
          case "$digest" in sha256:*) ;; *) echo "::error::no image digest"; exit 1 ;; esac
          echo "DIGEST=$digest" >> "$GITHUB_ENV"
          echo "Pushed $IMAGE@$digest"
      - name: Sign the image digest, verify it, then tag the version
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign verify --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" "$IMAGE@$DIGEST"
          # Beta: the version only, never X.Y or latest.
          docker buildx imagetools create --tag "$IMAGE:$version" "$IMAGE@$DIGEST"
      - name: Name the image digest in the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="$GITHUB_REF_NAME"
          gh release view "$tag" --json body --jq .body > notes.md
          if ! grep -q "$DIGEST" notes.md; then
            printf '\nEdge agent image (beta): `%s@%s`, signed by %s.\n' "$IMAGE" "$DIGEST" "$IDENTITY" >> notes.md
            gh release edit "$tag" --notes-file notes.md
          fi
