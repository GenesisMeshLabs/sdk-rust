name: Edge agent soak (release)

# Release pull requests: the two-hour scenario of edge-soak.yml against the core
# branch of the same name when it exists, main otherwise. Pull requests only,
# which run without write access or secrets.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: edge-soak-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  soak:
    if: startsWith(github.head_ref, 'release/')
    name: Soak x86_64-unknown-linux-musl
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      TARGET: x86_64-unknown-linux-musl
      CC_x86_64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The toolchain the build script pins
        id: pin
        run: echo "toolchain=$(sed -n 's/^RUST_TOOLCHAIN=//p' scripts/build_verifier.sh)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ steps.pin.outputs.toolchain }}
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools time
      - name: Build
        run: |
          set -eu
          sh scripts/build_edge.sh "$TARGET" dist
          name="$(cd dist && ls genesis-mesh-edge-* | grep -Ev '\.(sha256|buildinfo)$')"
          echo "BINARY=$GITHUB_WORKSPACE/dist/$name" >> "$GITHUB_ENV"
      - name: Choose the core revision
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          ref=main
          if git ls-remote --exit-code --heads https://github.com/GenesisMeshLabs/genesismesh.git "refs/heads/$BRANCH" > /dev/null; then
            ref="$BRANCH"
          fi
          echo "Testing with core revision: $ref"
          echo "CORE_REF=$ref" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: GenesisMeshLabs/genesismesh
          ref: ${{ env.CORE_REF }}
          path: core
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ./core
      - name: Two hours with the NA stopped
        env:
          GM_E2E_PYTHON: python
          GM_E2E_REQUIRED: "1"
          GM_EDGE_OFFLINE_SECONDS: "7200"
        run: |
          set -eu
          export GM_EDGE_BINARY="$BINARY"
          export GM_EDGE_WRAP="/usr/bin/time -v -o $RUNNER_TEMP/time.txt"
          bash scripts/require_tests.sh \
            cargo test --locked -p genesis-mesh-edge --test scenario -- --nocapture --include-ignored --exact offline
          cat "$RUNNER_TEMP/time.txt"
          rss="$(sed -n 's/^[[:space:]]*Maximum resident set size (kbytes): //p' "$RUNNER_TEMP/time.txt")"
          jq -n --arg target "$TARGET" --argjson binary_bytes "$(stat -c %s "$BINARY")" \
            --argjson max_rss_kib "$rss" --argjson offline_seconds "$GM_EDGE_OFFLINE_SECONDS" \
            --argjson budget "$(jq --arg t "$TARGET" '.[$t]' edge/footprint-budgets.json)" \
            '{target: $target, binary_bytes: $binary_bytes, max_rss_kib: $max_rss_kib,
              offline_seconds: $offline_seconds, budget: $budget}' > "soak-$TARGET.json"
          cat "soak-$TARGET.json"
          budget="$(jq -r --arg t "$TARGET" '.[$t].max_rss_kib' edge/footprint-budgets.json)"
          if [ "$rss" -gt "$budget" ]; then
            echo "::error::the agent's maximum RSS was $rss KiB, over its budget of $budget"; exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soak-x86_64-unknown-linux-musl
          path: soak-x86_64-unknown-linux-musl.json
          if-no-files-found: error
