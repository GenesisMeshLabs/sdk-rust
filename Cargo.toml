[package]
name = "genesis-mesh-sdk"
version = "1.0.2"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Rust SDK for the Genesis Mesh Network Authority HTTP API."
repository = "https://github.com/GenesisMeshLabs/sdk-rust"
readme = "README.md"
keywords = ["genesis-mesh", "trust", "sdk", "ed25519"]
categories = ["api-bindings", "authentication"]
include = ["src/**", "examples/**", "tests/**", "scripts/check_release.py", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "CHANGELOG.md", "CONTRIBUTING.md", "RELEASING.md", "AGENT.md", "SECURITY.md", "VERSION"]
resolver = "3"

[dependencies]
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ed25519-dalek = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
percent-encoding = "2"
sha2 = { version = "0.11", default-features = false }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
